name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-linux:
    name: Tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -rs

  windows:
    name: Tests and SPrint.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyinstaller

      - name: Set up SumatraPDF and a printer that prints to a file
        shell: pwsh
        run: |
          $sumatra = "$env:LOCALAPPDATA\SumatraPDF"
          Invoke-WebRequest https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip -OutFile "$env:RUNNER_TEMP\sumatra.zip"
          Expand-Archive "$env:RUNNER_TEMP\sumatra.zip" -DestinationPath $sumatra
          Get-ChildItem $sumatra -Filter "SumatraPDF-*.exe" | Rename-Item -NewName SumatraPDF.exe
          $output = "$env:RUNNER_TEMP\sprint-test-output.pdf"
          Add-PrinterPort -Name $output
          Add-Printer -Name "SPrint Test PDF" -DriverName "Microsoft Print To PDF" -PortName $output
          Get-Printer | Format-Table Name, DriverName, PortName
          "SPRINT_TEST_PRINTER=SPrint Test PDF" >> $env:GITHUB_ENV
          "SPRINT_TEST_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Printer diagnostics (temporary)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          choco install adobereader -y --no-progress | Select-Object -Last 3
          @'
          import ctypes, os, time, win32print
          from pypdf import PdfWriter
          from sprint import printing
          from sprint.pdfdocs import read_document
          MM = 72 / 25.4
          OUT = os.environ["SPRINT_TEST_OUTPUT"]
          TEST = os.environ["SPRINT_TEST_PRINTER"]
          def level9():
              h = win32print.OpenPrinter(TEST)
              try:
                  dm = win32print.GetPrinter(h, 9)["pDevMode"]
                  return None if dm is None else (dm.PaperSize, dm.PaperWidth, dm.PaperLength)
              finally:
                  win32print.ClosePrinter(h)
          class PI9(ctypes.Structure):
              _fields_ = [("pDevMode", ctypes.c_void_p)]
          h = win32print.OpenPrinter(TEST)
          dm = win32print.GetPrinter(h, 8)["pDevMode"]
          dm.PaperSize = 8
          win32print.SetPrinter(h, 9, {"pDevMode": dm}, 0)
          print("level 9 after set:", level9())
          ok = ctypes.WinDLL("winspool.drv", use_last_error=True).SetPrinterW(ctypes.c_void_p(int(h)), 9, ctypes.byref(PI9(None)), 0)
          print("SetPrinterW(9, NULL) ->", ok, ctypes.get_last_error(), "level 9 now:", level9())
          win32print.ClosePrinter(h)
          def make(name, w, hh):
              wr = PdfWriter(); wr.add_blank_page(w * MM, hh * MM); wr.write(name); return os.path.abspath(name)
          odd, a3 = make("diag_odd.pdf", 300, 430), make("diag_a3.pdf", 297, 420)
          def measure(backend, path, paper=None):
              if os.path.exists(OUT): os.remove(OUT)
              t0 = time.monotonic()
              confirmed = backend.print_file(TEST, path, 1, paper)
              while not (os.path.exists(OUT) and os.path.getsize(OUT) > 0) and time.monotonic() - t0 < 90:
                  time.sleep(0.5)
              time.sleep(2)
              d = read_document(OUT)
              sizes = [(round(p.width_mm), round(p.height_mm)) for p in d.pages] if d.ok else d.error
              return sizes, "confirmed" if confirmed else "unconfirmed", round(time.monotonic() - t0, 1)
          s = printing.SumatraBackend(printing.find_sumatra())
          print("sumatra odd paper=297mm x 420mm ->", measure(s, odd, "297mm x 420mm"))
          adobe = printing.find_adobe()
          print("adobe:", adobe)
          if adobe:
              a = printing.AdobeBackend(adobe)
              print("adobe odd, default ->", measure(a, odd))
              with printing.PlotterPaper(TEST) as p:
                  p.apply(297, 420)
                  print("adobe odd, per-user A3 ->", measure(a, odd))
              print("adobe a3, default ->", measure(a, a3))
          '@ | python -

      - name: Run tests
        run: python -m pytest -v -rs

      - name: Build SPrint.exe
        run: pyinstaller --noconfirm SPrint.spec

      - name: Smoke-test SPrint.exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          python -c "from pypdf import PdfWriter; w = PdfWriter(); w.add_blank_page(595, 842); w.add_blank_page(1684, 2384); w.write('smoke/sample.pdf')"
          $app = Start-Process dist\SPrint.exe -ArgumentList '--smoke-test', "`"$PWD\smoke`"" -PassThru -Wait
          $log = "$env:APPDATA\SPrint\sprint.log"
          Get-Content $log -Tail 20
          if ($app.ExitCode -ne 0) { throw "SPrint.exe exited with $($app.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "Smoke test: 1 files read, failed: none" -Quiet)) {
            throw "SPrint.exe did not read the sample PDF"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SPrint-exe
          path: dist/SPrint.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SPrint-exe
      - name: Create release with SPrint.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SPrint.exe --repo "$GITHUB_REPOSITORY" --title "SPrint $GITHUB_REF_NAME" --generate-notes
