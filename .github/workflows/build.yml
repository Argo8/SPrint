name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-linux:
    name: Tests (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -rs

  windows:
    name: Tests and SPrint.exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyinstaller

      - name: Set up SumatraPDF and a printer that prints to a file
        shell: pwsh
        run: |
          $sumatra = "$env:LOCALAPPDATA\SumatraPDF"
          Invoke-WebRequest https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64.zip -OutFile "$env:RUNNER_TEMP\sumatra.zip"
          Expand-Archive "$env:RUNNER_TEMP\sumatra.zip" -DestinationPath $sumatra
          Get-ChildItem $sumatra -Filter "SumatraPDF-*.exe" | Rename-Item -NewName SumatraPDF.exe
          $output = "$env:RUNNER_TEMP\sprint-test-output.pdf"
          Add-PrinterPort -Name $output
          Add-Printer -Name "SPrint Test PDF" -DriverName "Microsoft Print To PDF" -PortName $output
          Get-Printer | Format-Table Name, DriverName, PortName
          "SPRINT_TEST_PRINTER=SPrint Test PDF" >> $env:GITHUB_ENV
          "SPRINT_TEST_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Printer diagnostics (temporary)
        shell: pwsh
        continue-on-error: true
        run: |
          @'
          import os, time, traceback, win32print
          from pypdf import PdfWriter
          from sprint import printing
          from sprint.pdfdocs import read_document
          MM = 72 / 25.4
          OUT = os.environ["SPRINT_TEST_OUTPUT"]
          TEST = os.environ["SPRINT_TEST_PRINTER"]
          def dm_info(name):
              h = win32print.OpenPrinter(name)
              out = {}
              for level in (2, 8, 9):
                  try:
                      dm = win32print.GetPrinter(h, level)["pDevMode"]
                      out[level] = None if dm is None else (dm.PaperSize, dm.PaperWidth, dm.PaperLength, dm.Orientation, hex(dm.Fields))
                  except Exception as e:
                      out[level] = f"ERR {e}"
              win32print.ClosePrinter(h)
              return out
          def make(name, w, h):
              wr = PdfWriter(); wr.add_blank_page(w * MM, h * MM); wr.write(name); return os.path.abspath(name)
          a4, a3 = make("diag_a4.pdf", 210, 297), make("diag_a3.pdf", 297, 420)
          backend = printing.SumatraBackend(printing.find_sumatra())
          def measure(path, paper=None):
              if os.path.exists(OUT): os.remove(OUT)
              backend.print_file(TEST, path, 1, paper)
              t0 = time.monotonic()
              while not (os.path.exists(OUT) and os.path.getsize(OUT) > 0) and time.monotonic() - t0 < 60:
                  time.sleep(0.5)
              time.sleep(2)
              d = read_document(OUT)
              return [(round(p.width_mm), round(p.height_mm)) for p in d.pages] if d.ok else d.error
          for p in ("Microsoft Print to PDF", TEST):
              print("DEVMODE", p, dm_info(p))
          print("forms:", [f["Name"] for f in win32print.EnumForms(win32print.OpenPrinter(TEST))][:40])
          print("1 a4 default ->", measure(a4))
          print("2 a3 default ->", measure(a3))
          print("3 a3 paper=A4 ->", measure(a3, "A4"))
          with printing.PlotterPaper(TEST) as paper:
              print("override A3 accepted", paper.apply(297, 420), dm_info(TEST))
              print("4 a4 with override A3 ->", measure(a4))
          print("after restore", dm_info(TEST), "restore_error", paper.restore_error)
          print("5 a4 after restore ->", measure(a4))
          with printing.PlotterPaper(TEST) as paper:
              try:
                  print("override custom 300x500", paper.apply(300, 500), dm_info(TEST))
                  print("6 a4 with custom ->", measure(a4))
              except Exception as e:
                  print("custom rejected:", repr(e))
          print("after restore 2", dm_info(TEST))
          '@ | python -

      - name: Run tests
        run: python -m pytest -v -rs

      - name: Build SPrint.exe
        run: pyinstaller --noconfirm SPrint.spec

      - name: Smoke-test SPrint.exe
        shell: pwsh
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          python -c "from pypdf import PdfWriter; w = PdfWriter(); w.add_blank_page(595, 842); w.add_blank_page(1684, 2384); w.write('smoke/sample.pdf')"
          $app = Start-Process dist\SPrint.exe -ArgumentList '--smoke-test', "`"$PWD\smoke`"" -PassThru -Wait
          $log = "$env:APPDATA\SPrint\sprint.log"
          Get-Content $log -Tail 20
          if ($app.ExitCode -ne 0) { throw "SPrint.exe exited with $($app.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "Smoke test: 1 files read, failed: none" -Quiet)) {
            throw "SPrint.exe did not read the sample PDF"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SPrint-exe
          path: dist/SPrint.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SPrint-exe
      - name: Create release with SPrint.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SPrint.exe --repo "$GITHUB_REPOSITORY" --title "SPrint $GITHUB_REF_NAME" --generate-notes
